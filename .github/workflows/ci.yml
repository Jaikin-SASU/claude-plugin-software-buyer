name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install and test (root)
        run: |
          npm ci
          npm test

      - name: Install, test and typecheck (server)
        working-directory: server
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Content blacklist check
        run: bash scripts/check-content.sh
